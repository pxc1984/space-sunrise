- type: entity
  name: snowman spawner
  id: SpawnMobSnowMan
  parent: MarkerBase
  suffix: NewYear | Passive
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _Sunrise/Mobs/Elemental/snowman.rsi
        state: state
      - state: ai
  - type: ConditionalSpawner
    prototypes:
      - MobSnowMan

- type: entity
  name: evil snowman spawner
  id: SpawnMobSnowManEvil
  parent: MarkerBase
  suffix: NewYear | Hostile
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: _Sunrise/Mobs/Elemental/snowman.rsi
        state: state
      - state: ai
  - type: ConditionalSpawner
    prototypes:
      - MobSnowManEvil

- type: entity
  name: Hellspawn Boss Spawner
  suffix: Boss
  id: SpawnMobHellspawnBoss
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: purple
    - state: hellspawn
      sprite: Markers/mobs.rsi
  - type: ConditionalSpawner
    prototypes:
      - MobHellspawnBoss
